<script>
const CONFIG = {
    fantasyCsv:
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTNWJQcW3ItSg9HrvQ3D_hmvXU0aayM1QFup05lFLCbIvhzfMWBT0wum8f8BRVz0_ryo4X6mEmRDu6s/pub?gid=1220418834&single=true&output=csv",

    teamsCsv:
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTNWJQcW3ItSg9HrvQ3D_hmvXU0aayM1QFup05lFLCbIvhzfMWBT0wum8f8BRVz0_ryo4X6mEmRDu6s/pub?gid=2004919509&single=true&output=csv",

    eventStart: new Date("2026-09-20T19:00:00+01:00"),
    eventDays: 7,
    fantasyBudget: 250
};

let fantasyData = [];
let teamsData = [];
let selectedTeam = "";

function parseCSV(text) {
    const rows = [];
    let row = [];
    let cell = "";
    let quoted = false;

    for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '"') {
            if (quoted && text[i + 1] === '"') {
                cell += '"';
                i++;
            } else {
                quoted = !quoted;
            }
        } else if (char === "," && !quoted) {
            row.push(cell);
            cell = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && text[i + 1] === "\n") {
                i++;
            }

            row.push(cell);
            cell = "";

            if (row.some(v => v.trim() !== "")) {
                rows.push(row);
            }

            row = [];
        } else {
            cell += char;
        }
    }

    row.push(cell);

    if (row.some(v => v.trim() !== "")) {
        rows.push(row);
    }

    return rows;
}

async function loadCSV(url, name) {
    const response = await fetch(url, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            `${name} returned HTTP ${response.status}`
        );
    }

    const text = await response.text();

    if (
        text.trim().startsWith("<!DOCTYPE") ||
        text.trim().startsWith("<html") ||
        text.includes("<head>")
    ) {
        throw new Error(
            `${name} returned HTML instead of CSV`
        );
    }

    return parseCSV(text);
}

function normalise(value) {
    return String(value ?? "").trim();
}

function number(value) {
    const n = parseFloat(
        String(value ?? "")
            .replace(/,/g, "")
            .replace(/[^\d.-]/g, "")
    );

    return Number.isFinite(n) ? n : 0;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function setStatus(id, message) {
    const el = document.getElementById(id);

    if (el) {
        el.textContent = message;
    }
}

async function loadData() {
    setStatus("load-status", "Loading data...");

    try {
        const [fantasyRows, teamRows] = await Promise.all([
            loadCSV(CONFIG.fantasyCsv, "Fantasy PvM"),
            loadCSV(CONFIG.teamsCsv, "Teams")
        ]);

        fantasyData = fantasyRows;
        teamsData = teamRows;

        localStorage.setItem(
            "fantasy_pvm_fantasy",
            JSON.stringify(fantasyData)
        );

        localStorage.setItem(
            "fantasy_pvm_teams",
            JSON.stringify(teamsData)
        );

        setStatus("load-status", "Data loaded successfully.");

        initialiseApp();

    } catch (error) {
        console.error("Data loading failed:", error);

        const cachedFantasy =
            localStorage.getItem("fantasy_pvm_fantasy");

        const cachedTeams =
            localStorage.getItem("fantasy_pvm_teams");

        if (cachedFantasy && cachedTeams) {
            fantasyData = JSON.parse(cachedFantasy);
            teamsData = JSON.parse(cachedTeams);

            setStatus(
                "load-status",
                `Live data failed; showing cached data. ${error.message}`
            );

            initialiseApp();
            return;
        }

        setStatus(
            "load-status",
            `ERROR: ${error.message}`
        );
    }
}

function initialiseApp() {
    buildTeams();
    loadRequestedTeam();
    renderAll();
}

function buildTeams() {
    const teams = [];

    for (let i = 0; i < teamsData.length; i++) {
        const row = teamsData[i];

        const first = normalise(row[0]);

        if (
            first &&
            first !== "Players" &&
            !first.toLowerCase().includes("team")
        ) {
            const nextRow = teamsData[i + 1];

            if (
                nextRow &&
                normalise(nextRow[0]).toLowerCase() === "players"
            ) {
                teams.push({
                    name: first,
                    start: i
                });
            }
        }
    }

    teams.sort((a, b) =>
        a.name.localeCompare(b.name, undefined, {
            sensitivity: "base"
        })
    );

    window.availableTeams = teams;
}

function loadRequestedTeam() {
    const params = new URLSearchParams(window.location.search);
    const requested = params.get("team");

    if (requested) {
        const found = window.availableTeams.find(
            team =>
                team.name.toLowerCase().replace(/\s+/g, "-") ===
                requested.toLowerCase()
        );

        if (found) {
            selectedTeam = found.name;
            return;
        }
    }

    const saved = localStorage.getItem(
        "fantasy_pvm_selected_team"
    );

    if (saved && window.availableTeams.some(t => t.name === saved)) {
        selectedTeam = saved;
        return;
    }

    if (window.availableTeams.length) {
        selectedTeam = window.availableTeams[0].name;
    }
}

function getTeam(name) {
    const team = window.availableTeams.find(
        t => t.name === name
    );

    if (!team) {
        return null;
    }

    const rows = teamsData;
    const start = team.start;

    const players = [];

    for (let i = start + 2; i < rows.length; i++) {
        const row = rows[i];

        if (!row) {
            continue;
        }

        const player = normalise(row[0]);

        if (!player) {
            break;
        }

        if (
            player.toLowerCase() === "team" ||
            player.toLowerCase() === "players"
        ) {
            break;
        }

        const value = number(row[1]);
        const points = number(row[2]);

        players.push({
            name: player,
            value,
            points
        });

        if (players.length >= 5) {
            break;
        }
    }

    const totalRow = rows[start + 7];

    return {
        name: team.name,
        players,
        totalValue: totalRow ? number(totalRow[1]) : 0,
        totalPoints: totalRow ? number(totalRow[2]) : 0
    };
}

function getPlayer(name) {
    if (!fantasyData.length) {
        return null;
    }

    const headers = fantasyData[0];

    for (let i = 1; i < fantasyData.length; i++) {
        const row = fantasyData[i];

        if (
            normalise(row[0]).toLowerCase() ===
            name.toLowerCase()
        ) {
            const daily = [];

            for (let col = 5; col <= 11; col++) {
                daily.push({
                    boss: normalise(headers[col]) || `Day ${col - 4}`,
                    points: number(row[col])
                });
            }

            return {
                name: normalise(row[0]),
                ehb: number(row[1]),
                value: number(row[2]),
                monthlyEhb: number(row[4]),
                daily,
                total: number(row[12])
            };
        }
    }

    return null;
}

function getCurrentDay() {
    const now = new Date();
    const start = CONFIG.eventStart;

    if (now < start) {
        return 0;
    }

    const elapsed =
        now.getTime() - start.getTime();

    const day =
        Math.floor(
            elapsed / (24 * 60 * 60 * 1000)
        ) + 1;

    return Math.min(day, CONFIG.eventDays);
}

function getCurrentBoss() {
    if (!fantasyData.length) {
        return "TBC";
    }

    const headers = fantasyData[0];
    const day = getCurrentDay();

    if (day < 1 || day > 7) {
        return "TBC";
    }

    return (
        normalise(headers[day + 4]) ||
        "TBC"
    );
}

function getTimeRemaining() {
    const now = new Date();
    const start = CONFIG.eventStart;

    if (now < start) {
        return start.getTime() - now.getTime();
    }

    const day = getCurrentDay();

    if (day < 1 || day > CONFIG.eventDays) {
        return 0;
    }

    const end =
        start.getTime() +
        day * 24 * 60 * 60 * 1000;

    return Math.max(0, end - now.getTime());
}

function formatTime(ms) {
    if (ms <= 0) {
        return "00:00:00";
    }

    const totalSeconds =
        Math.floor(ms / 1000);

    const days =
        Math.floor(totalSeconds / 86400);

    const hours =
        Math.floor((totalSeconds % 86400) / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const seconds =
        totalSeconds % 60;

    if (days > 0) {
        return `${days}d ${String(hours).padStart(2, "0")}h ${String(minutes).padStart(2, "0")}m`;
    }

    return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
}

function updateCountdown() {
    const countdown =
        document.getElementById("countdown");

    if (!countdown) {
        return;
    }

    countdown.textContent =
        formatTime(getTimeRemaining());
}

function renderAll() {
    renderTeamSelector();
    renderHome();
    renderLeaderboards();
    updateCountdown();
}

function renderTeamSelector() {
    const selector =
        document.getElementById("team-selector");

    if (!selector) {
        return;
    }

    selector.innerHTML = "";

    window.availableTeams.forEach(team => {
        const option =
            document.createElement("option");

        option.value = team.name;
        option.textContent = team.name;
        option.selected =
            team.name === selectedTeam;

        selector.appendChild(option);
    });
}

function changeTeam(name) {
    selectedTeam = name;

    localStorage.setItem(
        "fantasy_pvm_selected_team",
        name
    );

    const slug =
        name.toLowerCase().replace(/\s+/g, "-");

    const url =
        `${window.location.pathname}?team=${encodeURIComponent(slug)}`;

    window.history.replaceState({}, "", url);

    renderAll();
}

function renderHome() {
    const team = getTeam(selectedTeam);

    const title =
        document.getElementById("team-title");

    const players =
        document.getElementById("team-players");

    const total =
        document.getElementById("team-total");

    const value =
        document.getElementById("team-value");

    const boss =
        document.getElementById("current-boss");

    const day =
        document.getElementById("current-day");

    if (title) {
        title.textContent =
            team ? team.name : "No Team";
    }

    if (boss) {
        boss.textContent =
            getCurrentBoss();
    }

    if (day) {
        const current =
            getCurrentDay();

        day.textContent =
            current === 0
                ? "EVENT STARTS SOON"
                : `DAY ${current} / ${CONFIG.eventDays}`;
    }

    if (!team) {
        if (players) {
            players.innerHTML =
                "<p>No team selected.</p>";
        }
        return;
    }

    if (total) {
        total.textContent =
            team.totalPoints.toLocaleString(
                undefined,
                { maximumFractionDigits: 2 }
            );
    }

    if (value) {
        value.textContent =
            `${team.totalValue.toLocaleString()}m`;
    }

    if (players) {
        players.innerHTML =
            team.players.map(player => {
                const full =
                    getPlayer(player.name);

                return `
                    <div class="player-card"
                         onclick="showPlayer('${escapeHtml(player.name)}')">

                        <div class="player-name">
                            ${escapeHtml(player.name)}
                        </div>

                        <div class="player-stat">
                            <span>Value</span>
                            <strong>${player.value}m</strong>
                        </div>

                        <div class="player-stat">
                            <span>Points</span>
                            <strong>${player.points.toLocaleString(undefined, {
                                maximumFractionDigits: 2
                            })}</strong>
                        </div>

                        <div class="player-stat">
                            <span>EHB</span>
                            <strong>${full ? full.ehb.toLocaleString(undefined, {
                                maximumFractionDigits: 1
                            }) : "—"}</strong>
                        </div>
                    </div>
                `;
            }).join("");
    }
}

function renderLeaderboards() {
    const teamsBoard =
        document.getElementById("team-leaderboard");

    if (!teamsBoard || !window.availableTeams) {
        return;
    }

    const results =
        window.availableTeams
            .map(team => getTeam(team.name))
            .filter(Boolean)
            .sort((a, b) =>
                b.totalPoints - a.totalPoints
            );

    teamsBoard.innerHTML =
        results.map((team, index) => `
            <div class="leaderboard-row"
                 onclick="changeTeam('${escapeHtml(team.name)}')">

                <span class="rank">
                    ${index + 1}
                </span>

                <span class="lb-name">
                    ${escapeHtml(team.name)}
                </span>

                <strong>
                    ${team.totalPoints.toLocaleString(undefined, {
                        maximumFractionDigits: 2
                    })}
                </strong>
            </div>
        `).join("");
}

function showPlayer(name) {
    const player = getPlayer(name);

    if (!player) {
        return;
    }

    const modal =
        document.getElementById("player-modal");

    if (!modal) {
        return;
    }

    document.getElementById("modal-name").textContent =
        player.name;

    document.getElementById("modal-ehb").textContent =
        player.ehb.toLocaleString(undefined, {
            maximumFractionDigits: 1
        });

    document.getElementById("modal-value").textContent =
        `${player.value}m`;

    document.getElementById("modal-total").textContent =
        player.total.toLocaleString(undefined, {
            maximumFractionDigits: 2
        });

    const daily =
        document.getElementById("modal-daily");

    daily.innerHTML =
        player.daily.map(day => `
            <div class="daily-row">
                <span>${escapeHtml(day.boss)}</span>
                <strong>
                    ${day.points.toLocaleString(undefined, {
                        maximumFractionDigits: 2
                    })}
                </strong>
            </div>
        `).join("");

    modal.classList.remove("hidden");
}

function closePlayer() {
    const modal =
        document.getElementById("player-modal");

    if (modal) {
        modal.classList.add("hidden");
    }
}

/* IMPORTANT:
   Explicitly expose these functions globally because
   the HTML buttons use onclick="..."
*/
window.changeTeam = changeTeam;
window.showPlayer = showPlayer;
window.closePlayer = closePlayer;

window.manualRefresh = async function () {
    const button =
        document.getElementById("refresh-button");

    if (button) {
        button.disabled = true;
        button.textContent = "Refreshing...";
    }

    try {
        await loadData();
    } finally {
        if (button) {
            button.disabled = false;
            button.textContent = "Refresh";
        }
    }
};

setInterval(updateCountdown, 1000);

document.addEventListener("DOMContentLoaded", () => {
    loadData();
});
</script>
