<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRS Fantasy PVM League</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse CDN for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/Papa.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=RuneScape+Plain:wght@700&display=swap" rel="stylesheet">
    <style>
        .rs-font { font-family: 'Runescape Plain', sans-serif; letter-spacing: 0.5px; }
    </style>
</head>
<body class="bg-[#0b0e14] text-gray-200 min-h-screen font-sans">

    <!-- Top Navigation Bar -->
    <nav class="bg-[#131822] border-b border-gray-800 px-6 py-4 flex flex-col md:flex-row justify-between items-center shadow-md">
        <div class="flex items-center space-x-3 mb-4 md:mb-0">
            <span class="text-2xl">⚔️</span>
            <span class="text-xl font-bold tracking-wider text-amber-400 rs-font">OSRS FANTASY PVM LEAGUE</span>
        </div>
        <div class="flex flex-wrap gap-2">
            <button onclick="switchTab('home')" class="px-4 py-2 rounded bg-gray-800 hover:bg-gray-700 text-sm font-semibold transition">Home</button>
            <button onclick="switchTab('team-leaderboard')" class="px-4 py-2 rounded bg-gray-800 hover:bg-gray-700 text-sm font-semibold transition">Team Leaderboard</button>
            <button onclick="switchTab('pvm-leaderboard')" class="px-4 py-2 rounded bg-gray-800 hover:bg-gray-700 text-sm font-semibold transition">Player Leaderboard</button>
            <button onclick="switchTab('view-team')" class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-500 text-sm font-semibold transition text-white">View Team</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6">
        
        <!-- Team Search / Selector Bar -->
        <div class="bg-[#131822] border border-gray-800 rounded-lg p-4 mb-8 flex flex-col md:flex-row justify-between items-center shadow-lg">
            <div class="mb-4 md:mb-0">
                <h2 class="text-amber-400 font-bold tracking-wide text-lg rs-font uppercase">Select Fantasy Team</h2>
                <p class="text-xs text-gray-400">Search or choose a registered clan team roster</p>
            </div>
            <div class="flex items-center space-x-2 w-full md:w-auto">
                <input type="text" id="team-search-input" placeholder="Enter Team Name (e.g. Skrull)" value="Skrull" class="bg-[#1b2230] border border-gray-700 text-white rounded px-4 py-2 focus:outline-none focus:border-amber-500 w-full md:w-64">
                <button onclick="handleSearch()" class="bg-amber-600 hover:bg-amber-500 text-gray-900 font-bold px-5 py-2 rounded transition shadow">View</button>
            </div>
        </div>

        <!-- Main Team Display Section -->
        <div id="team-view-container" class="bg-[#131822] border border-gray-800 rounded-xl p-6 shadow-xl">
            
            <!-- Manager Header -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-800 pb-4 mb-6">
                <div>
                    <h1 id="current-team-title" class="text-2xl font-bold text-amber-400 rs-font tracking-wide">MANAGER: SKRULL</h1>
                    <p class="text-xs text-gray-400 uppercase tracking-widest mt-1">Active 5-Player Raid Party Roster</p>
                </div>
                <div class="mt-4 md:mt-0 bg-[#1b2230] border border-gray-700 px-4 py-2 rounded-lg text-right">
                    <span class="text-xs text-gray-400 block uppercase">Total Party Points</span>
                    <span id="total-team-points" class="text-2xl font-black text-green-400">0.00</span>
                </div>
            </div>

            <!-- Roster Raid Party Grid -->
            <div id="roster-cards" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                <!-- Player cards dynamically injected here -->
            </div>

        </div>

    </div>

    <!-- Script Logic -->
    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNWJQcW3ItSg9HrvQ3D_hmvXU0aayM1QFup05lFLCbIvhzfMWBT0wum8f8BRVz0_ryo4X6mEmRDu6s/pub?gid=2004919509&single=true&output=csv';

        function switchTab(tab) {
            alert("Switched to " + tab + " view (Tab routing can be customized next!)");
        }

        function handleSearch() {
            let inputVal = document.getElementById('team-search-input').value;
            if (inputVal) {
                fetchAndRenderTeam(inputVal);
            }
        }

        function fetchAndRenderTeam(teamName) {
            Papa.parse(csvUrl, {
                download: true,
                header: false,
                complete: function(results) {
                    const data = results.data;
                    let query = teamName.toLowerCase().trim();
                    let teamStartRow = -1;

                    // Scan Column A for the team name
                    for (let r = 0; r < data.length; r++) {
                        let cellValue = data[r][0] ? data[r][0].toString().trim().toLowerCase() : '';
                        if (cellValue === query) {
                            teamStartRow = r;
                            break;
                        }
                    }

                    const rosterContainer = document.getElementById('roster-cards');
                    rosterContainer.innerHTML = '';

                    if (teamStartRow !== -1) {
                        document.getElementById('current-team-title').innerText = `MANAGER: ${teamName.toUpperCase()}`;
                        let totalTeamPoints = 0;
                        let playerRowsFound = 0;

                        // Loop through the 5 player rows below the team header
                        for (let i = 1; i <= 5; i++) {
                            let currentRow = teamStartRow + 1 + i; 
                            
                            if (data[currentRow]) {
                                let playerName = data[currentRow][0] ? data[currentRow][0].toString().trim() : '';
                                let playerValue = data[currentRow][1] ? data[currentRow][1] : '0';
                                let playerPoints = parseFloat(data[currentRow][2]) || 0;

                                // Filter out blank slots or header labels like "Players"
                                if (playerName !== '' && playerName.toLowerCase() !== 'players' && playerName.toLowerCase() !== 'total points') {
                                    playerRowsFound++;
                                    totalTeamPoints += playerPoints;

                                    rosterContainer.innerHTML += `
                                        <div class="bg-[#1b2230] border border-gray-700/60 rounded-lg p-4 flex flex-col justify-between hover:border-amber-500/50 transition shadow-md">
                                            <div>
                                                <div class="flex justify-between items-center mb-3">
                                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-900/60 text-blue-300 border border-blue-700/50 uppercase">Raider 0${playerRowsFound}</span>
                                                    <span class="text-[10px] text-amber-400 font-semibold">OSRS PvM</span>
                                                </div>
                                                <h3 class="text-lg font-bold text-white mb-3 truncate tracking-wide">${playerName}</h3>
                                            </div>
                                            <div class="space-y-2 border-t border-gray-700/60 pt-3 text-xs">
                                                <div class="flex justify-between items-center">
                                                    <span class="text-gray-400">Item Value:</span> 
                                                    <span class="text-amber-300 font-semibold">${playerValue}</span>
                                                </div>
                                                <div class="flex justify-between items-center">
                                                    <span class="text-gray-400">PVM Points:</span> 
                                                    <span class="text-green-400 font-bold">${playerPoints.toFixed(2)}</span>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }
                            }
                        }

                        document.getElementById('total-team-points').innerText = totalTeamPoints.toFixed(2);

                    } else {
                        rosterContainer.innerHTML = `<div class="col-span-full text-center text-red-400 py-8 bg-[#1b2230] rounded-lg border border-gray-700">Team "${teamName}" not found in sheet. Check spelling or check your Teams tab.</div>`;
                        document.getElementById('current-team-title').innerText = `MANAGER: NOT FOUND`;
                        document.getElementById('total-team-points').innerText = "0.00";
                    }
                },
                error: function(error) {
                    console.error("Error parsing CSV data:", error);
                }
            });
        }

        // Load default team on page load
        document.addEventListener('DOMContentLoaded', () => {
            fetchAndRenderTeam("Skrull");
        });
    </script>
</body>
</html>
