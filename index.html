<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage OSRS - Fantasy PvM League</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse CDN for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/Papa.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Header / Controls -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 id="current-team-title" class="text-3xl font-extrabold tracking-wide text-blue-400">Team 1</h1>
            
            <!-- Optional team selector dropdown if you want to switch teams on the fly -->
            <div class="mt-4 md:mt-0 flex items-center space-x-3">
                <label for="team-select" class="text-sm text-gray-400">Select Team:</label>
                <select id="team-select" onchange="changeTeam(this.value)" class="bg-gray-800 border border-gray-700 text-white rounded px-3 py-1.5 focus:outline-none focus:border-blue-500">
                    <option value="Team 1">Team 1</option>
                    <option value="Team 2">Team 2</option>
                    <!-- Add more teams here as they get created -->
                </select>
            </div>
        </div>

        <!-- Roster Cards Container -->
        <div id="roster-cards" class="flex flex-wrap -mx-2 mb-8">
            <!-- Player cards will be injected here dynamically -->
        </div>

        <!-- Total Team Points Footer -->
        <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 flex justify-between items-center shadow-lg">
            <span class="text-xl font-semibold text-gray-300">Total Team Points</span>
            <span id="total-team-points" class="text-3xl font-black text-green-400">0.00</span>
        </div>
    </div>

    <!-- Frontend Script Logic -->
    <script>
        // Teams tab CSV URL linked automatically
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNWJQcW3ItSg9HrvQ3D_hmvXU0aayM1QFup05lFLCbIvhzfMWBT0wum8f8BRVz0_ryo4X6mEmRDu6s/pub?gid=2004919509&single=true&output=csv';

        let currentTeam = "Team 1";

        function changeTeam(selectedTeam) {
            currentTeam = selectedTeam;
            document.getElementById('current-team-title').innerText = currentTeam;
            fetchAndRenderTeam();
        }

        function fetchAndRenderTeam() {
            Papa.parse(csvUrl, {
                download: true,
                header: false,
                complete: function(results) {
                    const data = results.data;
                    let query = currentTeam.toLowerCase().trim();
                    let teamStartRow = -1;

                    // 1. Scan Column A (index 0) to find the row where the team name appears
                    for (let r = 0; r < data.length; r++) {
                        let cellValue = data[r][0] ? data[r][0].toString().trim().toLowerCase() : '';
                        if (cellValue === query) {
                            teamStartRow = r;
                            break;
                        }
                    }

                    const rosterContainer = document.getElementById('roster-cards');
                    rosterContainer.innerHTML = '';

                    if (teamStartRow !== -1) {
                        let totalTeamPoints = 0;
                        let playerRowsFound = 0;

                        // 2. Loop through the 5 player rows sitting below the team header and column labels
                        for (let i = 1; i <= 5; i++) {
                            let currentRow = teamStartRow + 1 + i; 
                            
                            if (data[currentRow]) {
                                let playerName = data[currentRow][0] ? data[currentRow][0].toString().trim() : '';
                                let playerValue = data[currentRow][1] ? data[currentRow][1] : '0';
                                let playerPoints = parseFloat(data[currentRow][2]) || 0;

                                // Only render if a player name is present and it's not a totals row
                                if (playerName !== '' && playerName.toLowerCase() !== 'total points') {
                                    playerRowsFound++;
                                    totalTeamPoints += playerPoints;

                                    rosterContainer.innerHTML += `
                                        <div class="w-full sm:w-1/2 md:w-1/3 lg:w-1/5 p-2">
                                            <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 text-white shadow-md flex flex-col justify-between h-full">
                                                <div>
                                                    <div class="flex justify-between items-center mb-2">
                                                        <span class="text-xs font-semibold text-blue-400 uppercase tracking-wider">Player ${playerRowsFound}</span>
                                                        <span class="text-xs text-yellow-500">Synced</span>
                                                    </div>
                                                    <h5 class="text-lg font-bold mb-3 truncate">${playerName}</h5>
                                                </div>
                                                <div class="space-y-1 text-sm border-t border-gray-700 pt-3">
                                                    <p class="text-gray-400 flex justify-between">
                                                        <span>Value:</span> 
                                                        <span class="text-white font-medium">${playerValue}</span>
                                                    </p>
                                                    <p class="text-gray-400 flex justify-between">
                                                        <span>Points:</span> 
                                                        <span class="text-green-400 font-bold">${playerPoints.toFixed(2)}</span>
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }
                            }
                        }

                        // 3. Output overall team total points to your UI element
                        document.getElementById('total-team-points').innerText = totalTeamPoints.toFixed(2);

                    } else {
                        rosterContainer.innerHTML = `<div class="col-span-full text-center text-red-400 py-6 bg-gray-800 rounded-lg border border-gray-700">Team "${currentTeam}" not found in sheet.</div>`;
                        document.getElementById('total-team-points').innerText = "0.00";
                    }
                },
                error: function(error) {
                    console.error("Error parsing CSV data:", error);
                    document.getElementById('roster-cards').innerHTML = `<div class="col-span-full text-center text-red-400 py-6">Failed to load team data from Google Sheets.</div>`;
                }
            });
        }

        // Run on page load
        document.addEventListener('DOMContentLoaded', () => {
            fetchAndRenderTeam();
        });
    </script>
</body>
</html>
